[package]
name = "camdl-tests"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
members = [
  ".",
  "crates/cli",
  "crates/differentiate-derive",
  "crates/external-harness",
  "crates/io",
  "crates/ir",
  "crates/numerics",
  "crates/runid",
  "crates/runid-derive",
  "crates/sim",
]
resolver = "2"

# One serde_json for the whole workspace, with `float_roundtrip`: without it
# serde_json's float parser can land one ULP away from the decimal it reads
# (`0.9724999999999999` parses as 0.9725), so a value written to JSON and read
# back is not the value written (gh#1018). Every JSON read path — IR load,
# summary JSON, diagnostics, events, fit.meta — relies on
# `bits(parse(serialize(x))) == bits(x)`. Declared here once, and every crate
# takes it with `serde_json.workspace = true`, so a crate built alone
# (`cargo test -p ir`) parses exactly too, not only a build where feature
# unification happens to switch it on.
[workspace.dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[[test]]
name = "golden_deser"
path = "tests/golden_deser.rs"

[[test]]
name = "external_validation"
path = "tests/external_validation.rs"

[dev-dependencies]
ir = { path = "crates/ir" }

# Dev-dep on external-harness is declared so cargo builds the binary and
# exposes CARGO_BIN_EXE_external-harness to tests/external_validation.rs.
# external-harness's lib.rs is an empty stub; the actual code lives in
# the binary modules. Dependency is on path only; no version pinning
# because it's in the same workspace.
external-harness = { path = "crates/external-harness" }

# Profiling profile: release-grade codegen + line tables so `samply`/`perf`
# can resolve symbols and source lines. Kept separate so the shipped
# `release` profile stays lean. Build with `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
debug = true
