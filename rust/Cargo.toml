[package]
name = "camdl-tests"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
members = [
  ".",
  "crates/cli",
  "crates/differentiate-derive",
  "crates/external-harness",
  "crates/io",
  "crates/ir",
  "crates/numerics",
  "crates/runid",
  "crates/runid-derive",
  "crates/sim",
]
resolver = "2"

# Lint policy, shared by every member via `[lints] workspace = true`.
#
# These two are ALLOWED deliberately, not because they are noisy. Both fire
# almost entirely on numerical kernels (the inference stack, the integrators),
# where the parameter list or the return type IS the domain: a `pgas` step
# genuinely takes model, params, state, rng, schedule, obs, and diagnostics,
# and bundling them into a struct to satisfy an arity count would restructure
# code whose correctness is the point, for no correctness gain. gh#743 asked
# for the gate to become real; silencing a style lint to get there is different
# from silencing a correctness one, and no correctness lint is allowed here.
#
# If a signature is genuinely unwieldy, refactor it on purpose in its own
# commit — do not add lints to this list to make a refactor unnecessary.
[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
# Same reasoning, one step further. Every remaining site is in the inference
# stack or an integrator (pgas, pmmh, nuts, ode, resampling), where the index
# IS the notation: `for i in 0..n { z[i] = ... }` mirrors the derivation it was
# transcribed from, and often walks several arrays at once. Converting those to
# iterator chains buys no correctness and makes a silent transposition — the
# hardest bug in this codebase to see — easier to introduce and harder to spot
# against the source formula. CLAUDE.md flags these exact files as high-risk
# "regardless of how mechanical the change looks".
needless_range_loop = "allow"
# `PGAS`, `PMMH`, `IF2` are the established names of the methods, in the
# literature and in every doc and flag here. `Pgas` would be a rename away from
# the domain for a style rule.
upper_case_acronyms = "allow"
# Fires on the CLI/resolve command enums, where the fix is to box a variant.
# These are constructed once per process from argv; the size difference costs
# nothing measurable, and boxing would add an indirection to the most-read
# dispatch code in the tree.
large_enum_variant = "allow"

[[test]]
name = "golden_deser"
path = "tests/golden_deser.rs"

[[test]]
name = "external_validation"
path = "tests/external_validation.rs"

[dev-dependencies]
ir = { path = "crates/ir" }

# Dev-dep on external-harness is declared so cargo builds the binary and
# exposes CARGO_BIN_EXE_external-harness to tests/external_validation.rs.
# external-harness's lib.rs is an empty stub; the actual code lives in
# the binary modules. Dependency is on path only; no version pinning
# because it's in the same workspace.
external-harness = { path = "crates/external-harness" }

# Profiling profile: release-grade codegen + line tables so `samply`/`perf`
# can resolve symbols and source lines. Kept separate so the shipped
# `release` profile stays lean. Build with `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
debug = true

[lints]
workspace = true
