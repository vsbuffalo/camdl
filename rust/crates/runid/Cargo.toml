[package]
name = "runid"
version = "0.1.0"
edition = "2021"
# Stated, not inferred: whether a build script exists is then a fact of this
# manifest, which the engine fingerprint hashes (cli/src/engine_fingerprint.rs).
build = false

[dependencies]
hex = "0.4"
ir = { path = "../ir" }
runid-derive = { path = "../runid-derive" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
sha2 = "0.10"
thiserror = "1"

[target.'cfg(unix)'.dependencies]
# Process-liveness check (kill(pid, 0)) for reclaiming a Mode B `.lock` whose
# holder PID is dead (a fit killed before finalize).
libc = "0.2"
