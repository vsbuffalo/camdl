[package]
name = "runid"
version = "0.1.0"
edition = "2021"

[dependencies]
hex = "0.4"
ir = { path = "../ir" }
runid-derive = { path = "../runid-derive" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"

[target.'cfg(unix)'.dependencies]
# Process-liveness check (kill(pid, 0)) for reclaiming a Mode B `.lock` whose
# holder PID is dead (a fit killed before finalize).
libc = "0.2"

[lints]
workspace = true
