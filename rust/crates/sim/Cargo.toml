[package]
name = "sim"
version = "0.1.0"
edition = "2021"

[dependencies]
# Lineage line-list Parquet output (2026-05-19 individual-sampling layer).
# Pinned; large dependency tree (see proposal report). Behind the default-on
# `lineage-parquet` feature so minimal builds (`--no-default-features`) keep
# only the dependency-free TSV writer.
arrow = { version = "53", optional = true, default-features = false }
bincode = "1"
bitflags = "2"
ir = { path = "../ir" }
numerics = { path = "../numerics" }
# gh#audit-H2. libm provides high-precision erfc for the discretized-
# normal CDF tail accuracy fix (replaces the A&S 7.1.26 rational
# approximation with max abs error ~1.5e-7, which dominated tail
# probabilities for AFP-style rare-event surveillance).
libm = "0.2"
log = "0.4"
nlopt = { version = "0.8", optional = true }
parquet = { version = "53", optional = true, default-features = false, features = ["arrow"] }
rand = "0.8"
rand_chacha = { version = "0.3", features = ["serde1"] }
rand_distr = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Inline-capacity vectors for the scheduling spine's TimelineStop reasons and
# EffectBatch index lists — both small in the common case (≤4 reasons / due
# effects per stop), so the inline storage avoids per-substep heap allocation
# on the inference hot path. Already pinned at 1.15.1 via cli's dependency tree.
smallvec = "1"
thiserror = "1"

[features]
default = ["ode", "lineage-parquet"]
# Parquet line-list output for the individual-sampling layer. Default-on so
# normal builds get the production format; the TSV writer is always available
# regardless. Disable with `--no-default-features` for a parquet-free build.
lineage-parquet = ["dep:arrow", "dep:parquet"]
# `ode` gates the NLopt-backed deterministic-inference algorithms
# (nl-sbplx, nl-bobyqa) and — in later phases — `mh` and `nuts`.
# Default-on so install scripts and dev builds pick it up; can be
# disabled with `--no-default-features` for minimal builds.
ode = ["dep:nlopt"]

[dev-dependencies]
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }
# Property-based testing for the scheduling-spine invariants (firing-invariance
# over generated schedules — the generated-combination class that hid gh#216).
# Test-only: zero runtime / supply-chain surface in the shipped binary.
proptest = "1"
serde_json = "1"

[[bench]]
name = "scaling"
harness = false

# A/B: pre-resolved eval_resolved vs string-keyed eval_expr on a model's
# rate exprs. Custom main (no criterion harness); pass a model IR path:
#   cargo bench -p sim --bench eval_ab -- <model.ir.json> [label]
[[bench]]
name = "eval_ab"
harness = false

# gh#209: recursive eval_resolved (tree-walk) vs eval_flat (flat bytecode VM):
#   cargo bench -p sim --bench flat_eval -- <model.ir.json> [label]
[[bench]]
name = "flat_eval"
harness = false

[lints]
workspace = true
