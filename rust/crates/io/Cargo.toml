[package]
name = "io"
version = "0.1.0"
edition = "2021"
# Stated, not inferred: whether a build script exists is then a fact of this
# manifest, which the engine fingerprint hashes (cli/src/engine_fingerprint.rs).
build = false

[dependencies]
ir = { path = "../ir" }
sim = { path = "../sim" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
