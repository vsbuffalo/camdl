[package]
name = "cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "camdl"
path = "src/main.rs"

[dependencies]
axum = "0.7"
bincode = "1"
clap = { version = "4", features = ["derive", "env"] }
# Table formatting for `camdl list` — automatic width/wrapping, preserves
# ANSI styling. Single TTY-detection dep (crossterm) — no big tree.
comfy-table = "7"
csv = "1"
env_logger = "0.11"
# MRE bundle tarball (`camdl mre`): the de-facto Rust tar + gzip crates
# (small, pure-Rust-capable trees). `.tar.gz` is the universal interchange
# format for a bundle a colleague emails / attaches to an issue.
flate2 = "1"
hex = "0.4"
indexmap = { version = "2", features = ["serde"] }
indicatif = "0.17"
io = { path = "../io" }
ir = { path = "../ir" }
log = "0.4"
# Terminal colors for `camdl list/show/cat` output. Zero-dep, zero-alloc,
# respects NO_COLOR when the `supports-colors` feature is enabled on the
# call site via `.if_supports_color(...)`.
owo-colors = { version = "4", features = ["supports-colors"] }
rand = "0.8"
rand_distr = "0.4"
rayon = "1"
runid = { path = "../runid" }
# Semver parse + compare for `camdl check-update` (release tag vs this binary).
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sim = { path = "../sim", default-features = false }
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
toml = { version = "0.8", features = ["parse", "display"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
# HTTP client for `camdl check-update` (and the future binary updater).
# rustls backend = no system OpenSSL to locate at build/runtime, serving the
# no-admin / self-contained-binary goals; blocking, so no async runtime.
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(unix)'.dependencies]
# Process-liveness check (kill(pid, 0)) for the single-flight IR-compile lock:
# a contender waits only while the lock holder is alive, and reclaims a lock
# left by a crashed/OOM-killed leader. Same idiom as `runid::store`'s Mode-B
# `.lock` reclaim (gh#214).
libc = "0.2"

[features]
default = ["ode", "lineage-parquet"]
# `ode` enables the deterministic-inference algorithms (nl-sbplx, nl-bobyqa
# in Phase 1; mh, nuts in later phases) by turning on sim's `ode` feature
# (which pulls in the `nlopt` C-FFI dep). Default-on so install scripts and
# dev builds pick it up; `--no-default-features` produces a minimal binary
# without those algorithms.
ode = ["sim/ode"]
# `lineage-parquet` enables Parquet line-list output for the individual-
# sampling layer (forwards to sim's feature, which pulls arrow + parquet —
# a large dependency tree, ~54 transitive crates). Default-on for the
# production binary; `--no-default-features` keeps only the TSV writer.
lineage-parquet = ["sim/lineage-parquet"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
