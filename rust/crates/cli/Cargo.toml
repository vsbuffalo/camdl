[package]
name = "cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "camdl"
path = "src/main.rs"

[dependencies]
axum = "0.7"
bincode = "1"
csv = "1"
hex = "0.4"
indexmap = { version = "2", features = ["serde"] }
indicatif = "0.17"
io = { path = "../io" }
ir = { path = "../ir" }
runid = { path = "../runid" }
rand = "0.8"
rand_distr = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sim = { path = "../sim", default-features = false }
log = "0.4"
env_logger = "0.11"
# Terminal colors for `camdl list/show/cat` output. Zero-dep, zero-alloc,
# respects NO_COLOR when the `supports-colors` feature is enabled on the
# call site via `.if_supports_color(...)`.
owo-colors = { version = "4", features = ["supports-colors"] }
# Table formatting for `camdl list` — automatic width/wrapping, preserves
# ANSI styling. Single TTY-detection dep (crossterm) — no big tree.
comfy-table = "7"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
toml = { version = "0.8", features = ["parse"] }
clap = { version = "4", features = ["derive", "env"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }

[features]
default = ["ode", "lineage-parquet"]
# `ode` enables the deterministic-inference algorithms (nl-sbplx, nl-bobyqa
# in Phase 1; mh, nuts in later phases) by turning on sim's `ode` feature
# (which pulls in the `nlopt` C-FFI dep). Default-on so install scripts and
# dev builds pick it up; `--no-default-features` produces a minimal binary
# without those algorithms.
ode = ["sim/ode"]
# `lineage-parquet` enables Parquet line-list output for the individual-
# sampling layer (forwards to sim's feature, which pulls arrow + parquet —
# a large dependency tree, ~54 transitive crates). Default-on for the
# production binary; `--no-default-features` keeps only the TSV writer.
lineage-parquet = ["sim/lineage-parquet"]

[dev-dependencies]
tempfile = "3"
