[package]
name = "ir"
version = "0.1.0"
edition = "2021"
# Stated, not inferred: whether a build script exists is then a fact of this
# manifest, which the engine fingerprint hashes (cli/src/engine_fingerprint.rs).
build = false

[dependencies]
# `initial_conditions` is an ORDERED map: the JSON object's key order is the
# model's declaration order, and both sides must round-trip it (the OCaml side
# is an association list). A `HashMap` would drop it on deserialize.
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
thiserror = "1"
sha2 = "0.10"
hex = "0.4"
differentiate-derive = { path = "../differentiate-derive" }
# The declared-model types; `ParamKind` is defined there and re-exported here.
declared = { path = "../declared" }

[dev-dependencies]
boon = "0.6.1"
proptest = "1"
