name: CI

# Runs on every push / PR to main. Linux-only — cross-platform builds
# are gated behind tags (see release.yml) because macOS runners are
# billed 10× and Windows 2× the Linux rate, and the Rust code is
# platform-invariant (no OS-conditional cfgs).
#
# Structure: `changes` decides whether non-doc code changed; `test`
# (the real suite) runs only when it did; `ci` is a tiny always-runs
# gate that is the REQUIRED status check. This keeps doc-only changes
# cheap (test is skipped) without deadlocking branch protection — the
# `ci` check always reports a verdict even when `test` is skipped. Do
# not make `test` the required check directly; make `ci` required.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.f.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        name: Detect whether non-doc code changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base="$(git rev-parse HEAD~1 2>/dev/null || echo HEAD)"
            fi
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          echo "base=$base"
          echo "changed files:"
          echo "$changed"
          # code=true if ANY changed path is not doc/fixture/meta.
          if echo "$changed" | grep -qvE '^(docs/|examples/|.*\.md$|\.gitignore$|LICENSE$)'; then
            echo "code=true"  >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── OCaml ──────────────────────────────────────────
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"
          dune-cache: true

      - name: Install OCaml dependencies
        run: |
          cd ocaml
          opam install . --deps-only --with-test --yes

      - name: Build OCaml
        run: opam exec -- make build-ocaml

      - name: Test OCaml
        run: opam exec -- bash -c "cd ocaml && dune runtest"

      # ── Rust ───────────────────────────────────────────
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      - name: Build Rust
        run: make build-rust

      - name: Clippy
        run: cd rust && cargo clippy --all-targets -- -D warnings

      # ── Install camdlc to ~/.local/bin + put on PATH ───
      # Several Rust integration tests (`scenario_runtime_application`,
      # `synthetic_fit_grid`, …) shell out to the built `camdl` binary,
      # which in turn needs to locate `camdlc` to compile inline .camdl
      # sources. `make install` puts camdlc at ~/.local/bin/camdlc; we
      # export that directory so the spawned binary's PATH search finds
      # it.
      - name: Install camdlc on PATH
        run: |
          opam exec -- make install
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Rust tests
        run: cd rust && cargo test

      # ── Integration ────────────────────────────────────
      - name: Update golden files
        run: opam exec -- make update-golden

      - name: Check golden files unchanged
        run: git diff --exit-code ir/golden/ ocaml/golden/

      - name: Integration tests
        run: opam exec -- make test-integration

  ci:
    # The REQUIRED status check (point branch protection at `ci`, not
    # `test`). Always runs so protection always gets a verdict; fails
    # only if `test` actually failed/was cancelled — a skipped `test`
    # (legitimate for doc-only changes) passes the gate.
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        run: |
          echo "changes.code = ${{ needs.changes.outputs.code }}"
          echo "test.result  = ${{ needs.test.result }}"
          case "${{ needs.test.result }}" in
            failure|cancelled)
              echo "::error::test job ${{ needs.test.result }}"
              exit 1 ;;
            *)
              echo "CI gate passed (test: ${{ needs.test.result }})" ;;
          esac
