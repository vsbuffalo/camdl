name: CI

# Backend gate: builds the OCaml compiler (camdlc), runs the Rust workspace
# tests EXCEPT the sim crate (which has its own Inference workflow), clippy, the
# golden-file determinism check, and the cross-language integration suite. The
# OCaml compiler's own unit tests run in the Compiler workflow; the simulation
# engine + inference suite runs in the Inference workflow. Together with those,
# this is the same surface `make test` runs locally.
#
# Linux-only: macOS/Windows runners bill 10×/2× and the code is platform-
# invariant.
#
# Structure: `changes` decides whether any non-doc path changed; `test` (the
# real suite) runs only when it did; `ci` is a tiny always-runs gate that is the
# REQUIRED status check. This keeps doc-only changes cheap (test is skipped)
# WITHOUT deadlocking branch protection — a required check keyed on `test` would
# never report on a doc-only PR (the job never runs), so the PR would wait
# forever for a status that never arrives. `ci` always reports a verdict.
# Make `ci` the required check in branch protection, NOT `test`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.f.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        name: Detect whether non-doc code changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base="$(git rev-parse HEAD~1 2>/dev/null || echo HEAD)"
            fi
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          echo "base=$base"
          echo "changed files:"; echo "$changed"
          # code=true if ANY changed path is not doc/example/meta.
          if echo "$changed" | grep -qvE '^(docs/|examples/|.*\.md$|\.gitignore$|LICENSE$)'; then
            echo "code=true"  >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"
          dune-cache: true

      - name: Install OCaml dependencies
        run: |
          cd ocaml
          opam install . --deps-only --with-test --yes

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      - name: Clippy
        run: cd rust && cargo clippy --all-targets -- -D warnings

      # make test-rust builds camdlc + the release binaries, symlinks camdlc onto
      # PATH (so spawned `camdl` finds it), and runs `cargo test --workspace
      # --exclude sim --no-fail-fast`.
      - name: Rust tests (workspace except sim)
        run: opam exec -- make test-rust

      - name: Golden files unchanged
        # `make update-golden` regenerates ALL golden corpora in place
        # (ocaml/corner/regression/reactive); the diff must cover every path it
        # writes, else compile-drift in the reactive (tests/fixtures/reactive/ir)
        # or regression (tests/fixtures/regression/ir) goldens slips through —
        # those live OUTSIDE ir/golden|ocaml/golden. This is the CI equivalent of
        # `make check-reactive-golden`, which the local full gate also runs.
        run: |
          opam exec -- make update-golden
          git diff --exit-code ir/golden/ ocaml/golden/ \
            tests/fixtures/reactive/ir/ tests/fixtures/regression/ir/

      - name: Integration tests
        run: opam exec -- make test-integration

  # Always-runs required gate. Passes when `test` succeeded OR was skipped
  # (doc-only change); fails only when `test` genuinely failed or was cancelled,
  # or the change-detector itself failed. This is the check to require in branch
  # protection.
  ci:
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verdict
        run: |
          echo "changes=${{ needs.changes.result }} test=${{ needs.test.result }}"
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "change-detector did not succeed"; exit 1
          fi
          case "${{ needs.test.result }}" in
            success|skipped) echo "ok"; exit 0 ;;
            *) echo "test job did not pass (result=${{ needs.test.result }})"; exit 1 ;;
          esac
