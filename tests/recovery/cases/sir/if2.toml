# IF2 recovery config for the SIR case. Estimate the two dynamical rates
# (beta, gamma); hold the observation/population params (N0, I0, rho, k) fixed at
# truth. 8 chains (a unimodal SIR needs few, but headroom guards against a
# stray start), random LHS init. Recovery target: beta=0.4, gamma=0.15.
output_dir = "results"

[model]
camdl = "model.camdl"

[data.observations]
weekly_cases = "data/weekly_cases.tsv"

[estimate]
beta  = { bounds = [0.05, 1.0], start = 0.25 }
gamma = { bounds = [0.01, 0.5], start = 0.10 }

[fixed]
N0  = 10000
I0  = 10
rho = 0.6
k   = 10.0

[method]
algorithm = "if2"
backend = "chain_binomial"
chains = 8
particles = 2000
iterations = 150
cooling = 0.7
