# Planted ground-truth parameters for the polio_metapop recovery case.
# `make synth` simulates model.camdl at these values (seed 1, chain_binomial)
# to produce the aggregate AFP observation stream the PGAS fit then recovers.
#
# Step 1 (machinery / identifiability test): only R0_c is estimated; everything
# else is held fixed at these values. rho_afp is set HIGH (0.3, ~30% detection)
# so the AFP signal is informative and R0_c is cleanly identifiable — this tests
# the fit machinery, separately from the realistic opaque-surveillance regime
# (rho_afp ~ 1/200) we dial down to later.

R0_c             = 6.0     # estimated
R0_v             = 2.0
gamma_v          = 0.05
gamma_c          = 0.05
p_recover_immune = 0.8
mu_rev           = 0.02
rho_afp          = 0.3
k                = 5.0
kappa            = 0.05
iota             = 0.0     # no ongoing importation — single-introduction outbreak
S0               = 225000  # initial susceptibles per (ward×age): ~45% of the 500k stratum
aging_rate       = 0.0005
birth_rate       = 0.0001
omega_a0         = 0.005
omega_a1         = 0.005
omega_a2         = 0.005
mu_a0            = 0.0002
mu_a1            = 0.0002
mu_a2            = 0.0002
