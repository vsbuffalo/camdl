# The PGAS posterior of the spatial polio AFP+ES multi-cadence fixture: the
# same problem as `fit.toml` (see its header for the data and the truth),
# under a posterior sampler. Run `fit.toml` first for the IF2 point
# estimate; to start every chain from it, add
# `starts = { from_mle = "<fit.toml's leaf>" }` under [method] and accept
# that R̂ is then not assessed. The default draws each chain from the priors.

[model]
camdl = "../polio_afp_es_2patch.camdl"

[data.observations]
afp = "data/afp.tsv"
es  = "data/es.tsv"

# Free parameters: the transmission rates, spatial coupling, shedding/clearance,
# and the two reporting params (AFP reporting fraction, ES sampling intensity).
# The CHECKED params (R0_urban, R0_rural, rho) START OFF TRUTH — outside the
# recovery test's tolerance band — so the test actually exercises recovery: IF2
# must CLIMB from a wrong point to truth, which only works if the multi-cadence
# scoring is correct. (A fixture that started at truth could not detect broken
# scoring — the asserted answer would already be the starting point.) Starts:
# R0_urban 2.2←truth 3.0, R0_rural 3.0←truth 2.2 (swapped — the filter must
# distinguish the two patches' rates from the union-axis data), rho 0.40←0.6.
# Flat priors → the IF2 scout targets the MLE and the PGAS posterior the scaled
# (unconditioned) likelihood; the likelihood is the object of interest.
[estimate]
R0_urban  = { bounds = [1.0, 6.0],   start = 2.2,  prior = { flat = {} } }
R0_rural  = { bounds = [1.0, 6.0],   start = 3.0,  prior = { flat = {} } }
kappa     = { bounds = [0.0, 0.3],   start = 0.05, prior = { flat = {} } }
gamma     = { bounds = [0.02, 0.5],  start = 0.1,  prior = { flat = {} } }
delta     = { bounds = [0.01, 0.3],  start = 0.05, prior = { flat = {} } }
rho       = { bounds = [0.1, 0.95],  start = 0.40, prior = { flat = {} } }
lambda    = { bounds = [0.001, 0.1], start = 0.01, prior = { flat = {} } }

# Held at truth: progression, paralysis fraction, waning, populations, seed,
# and the two negative-binomial dispersions (AFP `k`, ES `k_es`).
[fixed]
sigma     = 0.2
para_frac = 0.0005
omega     = 0.003
N0_urban  = 500000
N0_rural  = 150000
I0        = 20
k         = 10.0
k_es      = 10.0

[method]
algorithm = "pgas"
backend   = "chain_binomial"
chains    = 4
particles = 600
sweeps    = 300
