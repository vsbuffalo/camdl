# Recover-known-params config for the spatial polio AFP+ES multi-cadence fixture.
#
# Self-contained via [synthetic]: data is generated from `true_params` at the
# given `sim_seeds`, then each replicate is fit. No external data files needed —
# the runner simulates the AFP (monthly) + ES (biweekly) streams from the model's
# observation block at truth and fits them back.
#
# NOTE: the multi-cadence FIT path (heterogeneous per-stream cadences) is being
# implemented separately — proposal
# docs/dev/proposals/2026-06-10-multi-stream-multi-cadence-union-axis.md, Phase 2.
# Until that gate opens, `camdl fit run` on this config is REJECTED with the
# "All streams must have identical observation times" error (by design — the
# no-silent-gaps stance for machinery that does not yet exist). This config is
# staged so the recover-known-params test is ready the moment Phase 2 lands.

output_dir = "results"

[model]
camdl = "../polio_afp_es_2patch.camdl"

# Synthetic data: simulate the AFP + ES streams at truth, fit each replicate.
# Mutually exclusive with [data]; the runner derives data from these.
[synthetic]
true_params = "../polio_afp_es_2patch.params.toml"
sim_seeds   = [1, 2, 3]

# Free parameters: the transmission rates, spatial coupling, shedding/clearance,
# and the two reporting params (AFP reporting fraction, ES sampling intensity).
[estimate]
R0_urban  = { bounds = [0.5, 10.0], start = 2.0 }
R0_rural  = { bounds = [0.5, 10.0], start = 2.0 }
kappa     = { bounds = [0.0, 0.5],  start = 0.02 }
gamma     = { bounds = [0.01, 1.0], start = 0.08 }
delta     = { bounds = [0.01, 1.0], start = 0.08 }
rho       = { bounds = [0.0, 1.0],  start = 0.4 }
lambda    = { bounds = [0.001, 10.0], start = 0.5 }

# Held at truth: progression, paralysis fraction, waning, populations, seed,
# and the AFP dispersion (weakly identified from low/zero-heavy counts).
[fixed]
sigma     = 0.2
para_frac = 0.0005
omega     = 0.003
N0_urban  = 500000
N0_rural  = 150000
I0        = 20
k         = 10.0

# IF2 scout to localize, then a PGAS posterior. Both currently blocked by the
# multi-cadence gate (Phase 2); kept here as the full recovery pipeline.
[stages.scout]
algorithm  = "if2"
backend    = "chain_binomial"
chains     = 6
particles  = 2000
iterations = 120
cooling    = 0.7

[stages.posterior]
algorithm = "pgas"
backend   = "chain_binomial"
chains    = 4
particles = 600
sweeps    = 300
