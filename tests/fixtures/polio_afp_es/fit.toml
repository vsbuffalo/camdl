# Recover-known-params config for the spatial polio AFP+ES multi-cadence fixture.
#
# The multi-cadence FIT path (heterogeneous per-stream cadences — AFP monthly,
# ES biweekly) is open as of Phase 2b (proposal
# docs/dev/proposals/2026-06-10-multi-stream-multi-cadence-union-axis.md): `bind`
# merges the per-stream schedules to the union observation axis and the
# per-stream incidence reset scores each stream over its own cadence. `camdl fit
# run` loads and fits the two cadences end-to-end.
#
# Data: the committed long-form per-source files (`data/afp.tsv`, `data/es.tsv`),
# generated by `gen_data.sh` (seed 1) at the truth params in
# `../polio_afp_es_2patch.params.toml`. AFP rows fall on a 30-day grid, ES rows
# on a 14-day grid — two genuinely distinct cadences merged to a 74-point union.
# (The `[synthetic]` self-contained path does not yet emit per-source long-form
# for a stratified multi-source model — its wide block-name file binds each
# stratum leaf as its own `source`, which a `source = afp`/`source = es` model
# rejects. Per-source synthetic emission is a follow-up; until then the recovery
# fixture uses the committed `gen_data.sh` files.)

output_dir = "results"

[model]
camdl = "../polio_afp_es_2patch.camdl"

[data.observations]
afp = "data/afp.tsv"
es  = "data/es.tsv"

# Free parameters: the transmission rates, spatial coupling, shedding/clearance,
# and the two reporting params (AFP reporting fraction, ES sampling intensity).
# The CHECKED params (R0_urban, R0_rural, rho) START OFF TRUTH — outside the
# recovery test's tolerance band — so the test actually exercises recovery: IF2
# must CLIMB from a wrong point to truth, which only works if the multi-cadence
# scoring is correct. (A fixture that started at truth could not detect broken
# scoring — the asserted answer would already be the starting point.) Starts:
# R0_urban 2.2←truth 3.0, R0_rural 3.0←truth 2.2 (swapped — the filter must
# distinguish the two patches' rates from the union-axis data), rho 0.40←0.6.
# Flat priors → the IF2 scout targets the MLE and the PGAS posterior the scaled
# (unconditioned) likelihood; the likelihood is the object of interest.
[estimate]
R0_urban  = { bounds = [1.0, 6.0],   start = 2.2,  prior = { flat = {} } }
R0_rural  = { bounds = [1.0, 6.0],   start = 3.0,  prior = { flat = {} } }
kappa     = { bounds = [0.0, 0.3],   start = 0.05, prior = { flat = {} } }
gamma     = { bounds = [0.02, 0.5],  start = 0.1,  prior = { flat = {} } }
delta     = { bounds = [0.01, 0.3],  start = 0.05, prior = { flat = {} } }
rho       = { bounds = [0.1, 0.95],  start = 0.40, prior = { flat = {} } }
lambda    = { bounds = [0.001, 0.1], start = 0.01, prior = { flat = {} } }

# Held at truth: progression, paralysis fraction, waning, populations, seed,
# and the two negative-binomial dispersions (AFP `k`, ES `k_es`).
[fixed]
sigma     = 0.2
para_frac = 0.0005
omega     = 0.003
N0_urban  = 500000
N0_rural  = 150000
I0        = 20
k         = 10.0
k_es      = 10.0

# IF2 scout to localize, then a PGAS posterior — the full recovery pipeline.
[stages.scout]
algorithm  = "if2"
backend    = "chain_binomial"
chains     = 4
particles  = 2000
iterations = 50
cooling    = 0.5

[stages.posterior]
algorithm = "pgas"
backend   = "chain_binomial"
chains    = 4
particles = 600
sweeps    = 300
