# Self-contained MRE-bundle fixture. Run:
#   camdl mre fit tests/fixtures/mre/fit.toml
# The model read()s model/pop.tsv at compile time — the bundle captures it.
# cases.tsv was generated by simulating the model at beta=0.3, gamma=0.15.
[model]
camdl = "model/sir_patches.camdl"

[data]
file = "cases.tsv"

[estimate.beta]
bounds = [0.15, 0.6]
start = 0.3

[estimate.gamma]
bounds = [0.08, 0.3]
start = 0.15

[fixed]
rho = 0.6
k   = 20
I0  = 5

[method]
algorithm  = "if2"
backend    = "chain_binomial"
chains     = 2
particles  = 1000
iterations = 8
cooling    = 0.7
starts       = "single"
