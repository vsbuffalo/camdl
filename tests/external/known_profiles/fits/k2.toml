# K2: profile `rho` (lin(0.2, 0.95, 16)) with `X0` estimated over
# [25.0, 60.0], against ref/k2_profile.tsv. Flat at the saturated maximum where
# ybar / rho lies in the box (0.3358 <= rho <= 0.8060), the
# Poisson curve at the box edge outside it.
[model]
camdl = "../models/k2.camdl"

[data.observations]
y = "../data/k2_y.tsv"

[estimate]
rho = { bounds = [0.1, 1.0], start = 0.5 }
X0  = { bounds = [25.0, 60.0], start = 40.0 }

[fixed]

[method]
algorithm = "nl-bobyqa"
backend = "ode"
chains = 3
tolerance = 1e-10
