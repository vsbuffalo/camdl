<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 290" role="img" aria-labelledby="t d">
  <title id="t">A row's period, not its label, decides training</title>
  <desc id="d">Four rows under a cutoff at day 24. The same week, days 21 to 27, is labelled 21 under starting_on and 28 under closing_at; both are held out because the week ends at 28, after the cutoff. Under day(time), the row labelled 23 covers day 23, ends at 24 and trains; the row labelled 24 covers day 24, ends at 25 and is held out. Today the starting_on row and the day-24 row train because their labels are at or before 24.</desc>
  <style>
    text { font: 12px -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1d1f21; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 11.5px; }
    .b { font-weight: 600; }
    .mut { fill: #5d6166; }
    .tr { fill: #cfe9da; stroke: #2A7A51; stroke-width: 1.2; }
    .ho { fill: #cfe0f4; stroke: #1f5fa8; stroke-width: 1.2; }
    .ax { stroke: #5d6166; stroke-width: 1; }
    .cut { stroke: #B42318; stroke-width: 1.6; stroke-dasharray: 5 4; }
    .cutt { fill: #B42318; }
    .lab { fill: #1d1f21; }
    .chg { fill: #B45309; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e3e4e6; }
      .mut { fill: #a0a4aa; }
      .tr { fill: #1f3b2c; stroke: #6fcf9c; }
      .ho { fill: #1e3047; stroke: #7fb2ec; }
      .ax { stroke: #a0a4aa; }
      .cut { stroke: #f39a90; }
      .cutt { fill: #f39a90; }
      .lab { fill: #e3e4e6; }
      .chg { fill: #f0a35a; }
    }
  </style>

  <!-- column headers -->
  <text x="10" y="22" class="b">stream's covers line, and the row's label</text>
  <text x="560" y="22" class="b">today (label ≤ 24)</text>
  <text x="680" y="22" class="b">rule (end ≤ 24)</text>

  <!-- cutoff -->
  <line x1="440" y1="34" x2="440" y2="236" class="cut"/>
  <text x="440" y="252" text-anchor="middle" class="cutt b">cutoff: day 24 begins</text>

  <!-- row A: starting_on, label 21, [21,28) -->
  <text x="10" y="58" class="mono">starting_on(time, 7 'days)</text>
  <text x="10" y="73" class="mut">row "21"</text>
  <rect x="368" y="50" width="168" height="18" class="ho"/>
  <path d="M368,51 l6,8 l-6,8 l-6,-8 z" class="lab"/>
  <text x="560" y="63" class="chg b">trains</text>
  <text x="680" y="63">held out</text>

  <!-- row B: closing_at, label 28, [21,28) -->
  <text x="10" y="106" class="mono">closing_at(time, 7 'days)</text>
  <text x="10" y="121" class="mut">row "28", the same week</text>
  <rect x="368" y="98" width="168" height="18" class="ho"/>
  <path d="M536,99 l6,8 l-6,8 l-6,-8 z" class="lab"/>
  <text x="560" y="111">held out</text>
  <text x="680" y="111">held out</text>

  <!-- row C: day, label 23, [23,24) -->
  <text x="10" y="154" class="mono">day(time)</text>
  <text x="10" y="169" class="mut">row "23"</text>
  <rect x="416" y="146" width="24" height="18" class="tr"/>
  <path d="M416,147 l6,8 l-6,8 l-6,-8 z" class="lab"/>
  <text x="560" y="159">trains</text>
  <text x="680" y="159">trains</text>

  <!-- row D: day, label 24, [24,25) -->
  <text x="10" y="202" class="mono">day(time)</text>
  <text x="10" y="217" class="mut">row "24"</text>
  <rect x="440" y="194" width="24" height="18" class="ho"/>
  <path d="M440,195 l6,8 l-6,8 l-6,-8 z" class="lab"/>
  <text x="560" y="207" class="chg b">trains</text>
  <text x="680" y="207">held out</text>

  <!-- axis: x(d) = 200 + (d - 14) * 24 -->
  <line x1="200" y1="236" x2="548" y2="236" class="ax"/>
  <g class="ax">
    <line x1="200" y1="236" x2="200" y2="241"/><line x1="368" y1="236" x2="368" y2="241"/>
    <line x1="416" y1="236" x2="416" y2="241"/><line x1="464" y1="236" x2="464" y2="241"/>
    <line x1="536" y1="236" x2="536" y2="241"/>
  </g>
  <text x="200" y="268" text-anchor="middle" class="mut">day 14</text>
  <text x="368" y="268" text-anchor="middle" class="mut">21</text>
  <text x="416" y="268" text-anchor="middle" class="mut">23</text>
  <text x="464" y="268" text-anchor="middle" class="mut">25</text>
  <text x="536" y="268" text-anchor="middle" class="mut">28</text>

  <path d="M12,277 l5,7 l-5,7 l-5,-7 z" class="lab"/>
  <text x="24" y="288" class="mut">the label written in the file</text>
  <rect x="210" y="279" width="14" height="10" class="tr"/><text x="230" y="288" class="mut">trains</text>
  <rect x="290" y="279" width="14" height="10" class="ho"/><text x="310" y="288" class="mut">held out</text>
  <text x="380" y="288" class="chg">orange: today's answer, which the rule changes</text>
</svg>
