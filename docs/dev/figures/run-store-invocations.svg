<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 820 310" role="img" aria-label="Two invocations with different names resolve to one identity and share one stored result">
<style>
.dg{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.dg text{fill:#1d1f21}.dg .m{fill:#5d6166}.dg .t{font-weight:600}
.dg rect,.dg path.box{stroke-width:1.5}
.dg .box{fill:#ffffff;stroke:#5d6166}
.dg .id{fill:#e7f0ff;stroke:#0d6efd}.dg .ex{fill:#f1f3f5;stroke:#6c757d}.dg .st{fill:#fff4dc;stroke:#b7791f}
.dg .ok{fill:#e3f5ea;stroke:#198754}.dg .bad{fill:#fbe7e4;stroke:#c0392b}.dg .amb{fill:#efe8f9;stroke:#7952b3}
.dg .arrow{stroke:#5d6166;stroke-width:1.5;fill:none}.dg .ah{fill:#5d6166}.dg .dash{stroke-dasharray:5 4}
</style>
<defs><marker id="d1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="st" x="10" y="20" width="250" height="70" rx="8"/><text x="22" y="42" class="t">invocation 1</text><text x="22" y="62">simulate --params base.toml</text><text x="22" y="78" class="m">label "baseline", replicate 1</text>
<rect class="st" x="10" y="120" width="250" height="70" rx="8"/><text x="22" y="142" class="t">invocation 2</text><text x="22" y="162">simulate --params copy.toml</text><text x="22" y="178" class="m">label "for the talk", replicate 1</text>
<path class="arrow" d="M260 55H318L350 98" marker-end="url(#d1)"/>
<path class="arrow" d="M260 155H318L350 112" marker-end="url(#d1)"/>
<rect class="id" x="352" y="70" width="190" height="70" rx="8"/><text x="447" y="96" text-anchor="middle" class="t">one identity</text><text x="447" y="114" text-anchor="middle" class="m">same file contents, same</text><text x="447" y="128" text-anchor="middle" class="m">resolved values, same build</text>
<path class="arrow" d="M542 105H600" marker-end="url(#d1)"/>
<rect class="ok" x="602" y="62" width="208" height="86" rx="8"/><text x="706" y="88" text-anchor="middle" class="t">one result folder</text><text x="706" y="106" text-anchor="middle" class="m">computed once; contains no</text><text x="706" y="120" text-anchor="middle" class="m">name, label or replicate</text><text x="706" y="136" text-anchor="middle" class="m">number</text>
<rect class="box" x="10" y="226" width="250" height="60" rx="8"/><text x="22" y="248" class="t">invocation record 1</text><text x="22" y="268" class="m">inputs as given; result, label "baseline"</text>
<rect class="box" x="290" y="226" width="250" height="60" rx="8"/><text x="302" y="248" class="t">invocation record 2</text><text x="302" y="268" class="m">inputs as given; result, label "for the talk"</text>
<path class="arrow dash" d="M135 226V204H706V152" marker-end="url(#d1)"/>
<path class="arrow dash" d="M415 226V204"/>
<text x="570" y="262" class="m">Each record names the same run id.</text>
<text x="570" y="278" class="m">Names live here, never in the hash.</text>
</svg>
