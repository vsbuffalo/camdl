<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 270" role="img" aria-labelledby="t d">
  <title id="t">Two information sets and a forecast from one origin</title>
  <desc id="d">A weekly stream of ten periods. The parameters were fitted to the first four rows. The latent state was then filtered through two more rows. The forecast origin is the end of the sixth period. The next four periods are targets with horizons 0 to 3; each target's lead time is measured from the forecast origin to the end of its period. A horizon of four weeks includes the targets ending within four weeks of the origin.</desc>
  <defs>
    <marker id="tis-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="ahf"/>
    </marker>
  </defs>
  <style>
    text { font: 12px -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1d1f21; }
    .b { font-weight: 600; }
    .mut { fill: #5d6166; }
    .sm { font-size: 11px; }
    .tr { fill: #cfe9da; stroke: #2A7A51; stroke-width: 1.2; }
    .fl { fill: #cfe0f4; stroke: #1f5fa8; stroke-width: 1.2; }
    .tg { fill: #ece2f7; stroke: #6b3fa0; stroke-width: 1.2; }
    .ctr { fill: #2A7A51; } .str { stroke: #2A7A51; }
    .cfl { fill: #1f5fa8; } .sfl { stroke: #1f5fa8; }
    .ctg { fill: #6b3fa0; } .stg { stroke: #6b3fa0; }
    .ink { stroke: #1d1f21; } .ahf { fill: #6b3fa0; }
    .cut { stroke: #1d1f21; stroke-width: 1.6; stroke-dasharray: 5 4; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e3e4e6; }
      .mut { fill: #a0a4aa; }
      .tr { fill: #1f3b2c; stroke: #6fcf9c; }
      .fl { fill: #1e3047; stroke: #7fb2ec; }
      .tg { fill: #34274a; stroke: #c09cf0; }
      .ctr { fill: #6fcf9c; } .str { stroke: #6fcf9c; }
      .cfl { fill: #7fb2ec; } .sfl { stroke: #7fb2ec; }
      .ctg { fill: #c09cf0; } .stg { stroke: #c09cf0; }
      .ink { stroke: #e3e4e6; } .ahf { fill: #c09cf0; }
      .cut { stroke: #e3e4e6; }
    }
  </style>

  <!-- brackets -->
  <path d="M60,44 L60,36 L316,36 L316,44" fill="none" class="str" stroke-width="2"/>
  <text x="188" y="28" text-anchor="middle" class="b ctr">rows the parameters were fitted to</text>
  <path d="M60,66 L60,58 L444,58 L444,66" fill="none" class="sfl" stroke-width="2"/>
  <text x="438" y="52" text-anchor="end" class="b cfl">rows the latent state was filtered through</text>

  <!-- periods, 64 px each from x = 60 -->
  <rect x="60" y="74" width="64" height="24" class="tr"/><rect x="124" y="74" width="64" height="24" class="tr"/>
  <rect x="188" y="74" width="64" height="24" class="tr"/><rect x="252" y="74" width="64" height="24" class="tr"/>
  <rect x="316" y="74" width="64" height="24" class="fl"/><rect x="380" y="74" width="64" height="24" class="fl"/>
  <rect x="444" y="74" width="64" height="24" class="tg"/><rect x="508" y="74" width="64" height="24" class="tg"/>
  <rect x="572" y="74" width="64" height="24" class="tg"/><rect x="636" y="74" width="64" height="24" class="tg"/>
  <text x="476" y="90" text-anchor="middle" class="sm">horizon 0</text>
  <text x="540" y="90" text-anchor="middle" class="sm">horizon 1</text>
  <text x="604" y="90" text-anchor="middle" class="sm">horizon 2</text>
  <text x="668" y="90" text-anchor="middle" class="sm">horizon 3</text>

  <!-- forecast origin -->
  <line x1="444" y1="66" x2="444" y2="214" class="cut"/>
  <text x="444" y="230" text-anchor="middle" class="b">forecast origin</text>
  <text x="444" y="245" text-anchor="middle" class="mut sm">end of the last filtered row</text>

  <!-- lead times -->
  <path d="M444,116 L508,116" class="stg" stroke-width="1.4" fill="none" marker-end="url(#tis-ah)"/>
  <path d="M444,132 L572,132" class="stg" stroke-width="1.4" fill="none" marker-end="url(#tis-ah)"/>
  <path d="M444,148 L636,148" class="stg" stroke-width="1.4" fill="none" marker-end="url(#tis-ah)"/>
  <path d="M444,164 L700,164" class="stg" stroke-width="1.4" fill="none" marker-end="url(#tis-ah)"/>
  <text x="706" y="136" class="ctg sm">lead time:</text>
  <text x="706" y="151" class="ctg sm">origin to</text>
  <text x="706" y="166" class="ctg sm">period end</text>

  <!-- horizon reach -->
  <path d="M444,182 L444,188 L700,188 L700,182" fill="none" class="ink" stroke-width="1.4"/>
  <text x="454" y="204">--horizon "4 weeks": periods ending within 4 weeks</text>

  <text x="60" y="122" class="mut sm">Parameters: fitted once.</text>
  <text x="60" y="138" class="mut sm">State: conditioned on newer</text>
  <text x="60" y="154" class="mut sm">rows without a refit.</text>
  <text x="60" y="262" class="mut sm">Rolling forecasts repeat this with the origin moved later and the parameters unchanged (D35).</text>
</svg>
