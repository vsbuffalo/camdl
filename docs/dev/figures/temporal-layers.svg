<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" role="img" aria-labelledby="t d">
  <title id="t">Layers, seams and who owns each rule</title>
  <desc id="d">The compiler lowers temporal expressions to model time and emits the IR, which already carries the calendar axis, each stream's covers declaration, emit schedules and forcing knot times. In the runtime, one row reader turns each data row into its period; the training partition is built from those periods and recorded in the fit record; the forecast plan reads the partition and the filter's record of what it assimilated and lists the targets; the engines receive plain numbers; artifacts carry the calendar axis.</desc>
  <defs>
    <marker id="tl-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="ahf"/>
    </marker>
  </defs>
  <style>
    text { font: 12px -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1d1f21; }
    .b { font-weight: 600; }
    .mut { fill: #5d6166; }
    .sm { font-size: 11px; }
    .hd { font-size: 11px; font-weight: 600; fill: #5d6166; letter-spacing: .04em; }
    .stage { font-size: 11px; fill: #B45309; }
    .box { fill: #f4f4f2; stroke: #9a9da1; stroke-width: 1; }
    .new { fill: #ece2f7; stroke: #6b3fa0; stroke-width: 1.3; }
    .seam { stroke: #B45309; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .seamt { font-size: 10.5px; fill: #B45309; }
    .ar { stroke: #1d1f21; stroke-width: 1.3; fill: none; }
    .ahf { fill: #1d1f21; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e3e4e6; }
      .mut, .hd { fill: #a0a4aa; }
      .stage, .seamt { fill: #f0a35a; }
      .box { fill: #22252a; stroke: #5d6166; }
      .new { fill: #34274a; stroke: #c09cf0; }
      .seam { stroke: #f0a35a; }
      .ar { stroke: #e3e4e6; }
      .ahf { fill: #e3e4e6; }
    }
  </style>

  <text x="10" y="20" class="hd">COMPILER (OCAML)</text>
  <rect x="40" y="30" width="440" height="62" rx="6" class="box"/>
  <text x="56" y="52" class="b">camdlc: time typing and expansion</text>
  <text x="56" y="70" class="mut sm">instant vs duration, exact vs calendar, date() = start of its day,</text>
  <text x="56" y="84" class="mut sm">calendar stepping; every temporal expression lowered to model time</text>
  <text x="500" y="56" class="sm">owns the source-language rules</text>
  <text x="500" y="72" class="stage">Stage 0: lowering fixes</text>
  <path d="M260,92 L260,120" class="ar" marker-end="url(#tl-ah)"/>
  <line x1="20" y1="106" x2="760" y2="106" class="seam"/>
  <text x="756" y="101" text-anchor="end" class="seamt">seam: the JSON IR</text>

  <rect x="40" y="122" width="440" height="62" rx="6" class="box"/>
  <text x="56" y="144" class="b">IR (unchanged by this migration)</text>
  <text x="56" y="162" class="mut sm">time_unit and origin · each stream's covers (offset and span, or</text>
  <text x="56" y="176" class="mut sm">window columns) · column roles · emit schedules · forcing knot times</text>
  <text x="500" y="148" class="sm">follow-up proposal (D45):</text>
  <text x="500" y="164" class="sm">calendar covers forms (month, weeks)</text>
  <path d="M260,184 L260,212" class="ar" marker-end="url(#tl-ah)"/>
  <text x="10" y="204" class="hd">RUNTIME (RUST)</text>

  <rect x="40" y="214" width="440" height="52" rx="6" class="new"/>
  <text x="56" y="236" class="b">one row reader → ObservedRow { position, period, … }</text>
  <text x="56" y="254" class="mut sm">each row's period computed once; the label is hashed, never read as a time</text>
  <text x="500" y="236" class="sm">only producer of rows</text>
  <text x="500" y="252" class="stage">Stage 1: pure refactor</text>
  <path d="M260,266 L260,292" class="ar" marker-end="url(#tl-ah)"/>

  <rect x="40" y="294" width="440" height="52" rx="6" class="new"/>
  <text x="56" y="316" class="b">TrainingPartition: per stream, first n rows + their digest</text>
  <text x="56" y="334" class="mut sm">decided once from periods; written to fit.meta.json; read by every later step</text>
  <text x="500" y="316" class="sm">training membership</text>
  <text x="500" y="332" class="stage">Stage 2</text>
  <path d="M260,346 L260,374" class="ar" marker-end="url(#tl-ah)"/>

  <rect x="40" y="376" width="440" height="66" rx="6" class="new"/>
  <text x="56" y="398" class="b">ForecastPlan { mode, origin, horizon, conditioning, targets, notes }</text>
  <text x="56" y="416" class="mut sm">what to predict, the same for every backend; conditioning = partition</text>
  <text x="56" y="430" class="mut sm">(from the fit record) + what the filter reports it assimilated</text>
  <text x="500" y="398" class="sm">targets, origin, horizons</text>
  <text x="500" y="414" class="stage">Stage 3 (alignment), 5, 6</text>
  <path d="M260,442 L260,472" class="ar" marker-end="url(#tl-ah)"/>
  <line x1="20" y1="457" x2="760" y2="457" class="seam"/>
  <text x="756" y="452" text-anchor="end" class="seamt">seam: plain numbers (snapshot times, each target's start and end)</text>

  <rect x="40" y="474" width="210" height="56" rx="6" class="box"/>
  <text x="52" y="496" class="b">Engines (unchanged)</text>
  <text x="52" y="514" class="mut sm">ODE · chain-binomial · Gillespie</text>
  <rect x="270" y="474" width="210" height="56" rx="6" class="new"/>
  <text x="282" y="496" class="b">Artifacts + CalendarAxis</text>
  <text x="282" y="514" class="mut sm">run.json, fit.meta.json, scores</text>
  <path d="M250,502 L268,502" class="ar" marker-end="url(#tl-ah)"/>
  <text x="500" y="496" class="sm">dates in every artifact</text>
  <text x="500" y="512" class="stage">Stage 4</text>

  <rect x="40" y="542" width="12" height="12" class="new"/><text x="58" y="552" class="sm">new or extended</text>
  <rect x="170" y="542" width="12" height="12" class="box"/><text x="188" y="552" class="sm">unchanged</text>
</svg>
