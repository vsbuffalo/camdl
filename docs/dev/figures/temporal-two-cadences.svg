<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 250" role="img" aria-labelledby="t d">
  <title id="t">Horizons on two streams that report at different rates</title>
  <desc id="d">A daily stream observed through day 23 and a weekly stream whose last row covered days 14 to 20. The forecast origin is the start of day 24. The daily stream's targets are days 24, 25, 26 and on, with horizons 0, 1, 2. The weekly stream's week of days 21 to 27 is under way at the origin: days 21 to 23 have happened and are inferred from the state, days 24 to 27 are predicted, and together they are horizon 0. Days 28 to 34 are horizon 1 and days 35 to 41 horizon 2.</desc>
  <style>
    text { font: 12px -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1d1f21; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 11.5px; }
    .b { font-weight: 600; }
    .mut { fill: #5d6166; }
    .sm { font-size: 11px; }
    .fl { fill: #cfe0f4; stroke: #1f5fa8; stroke-width: 1.1; }
    .tg { fill: #ece2f7; stroke: #6b3fa0; stroke-width: 1.1; }
    .el { fill: url(#ttc-hatch); stroke: #6b3fa0; stroke-width: 1.1; }
    .hl { stroke: #6b3fa0; stroke-width: 1.2; }
    .ax { stroke: #5d6166; }
    .cut { stroke: #1d1f21; stroke-width: 1.6; stroke-dasharray: 5 4; }
    .bg { fill: #ece2f7; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e3e4e6; }
      .mut { fill: #a0a4aa; }
      .fl { fill: #1e3047; stroke: #7fb2ec; }
      .tg { fill: #34274a; stroke: #c09cf0; }
      .el { stroke: #c09cf0; }
      .hl { stroke: #c09cf0; }
      .ax { stroke: #a0a4aa; }
      .cut { stroke: #e3e4e6; }
      .bg { fill: #34274a; }
    }
  </style>
  <defs>
    <pattern id="ttc-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" class="bg"/>
      <line x1="0" y1="0" x2="0" y2="6" class="hl"/>
    </pattern>
  </defs>

  <!-- x(d) = 160 + (d - 14) * 20 -->
  <text x="10" y="56" class="mono">day(time)</text>
  <text x="10" y="71" class="mut sm">daily stream</text>
  <text x="10" y="126" class="mono">closing_at(time, 7 'days)</text>
  <text x="10" y="141" class="mut sm">weekly stream</text>
  <g transform="translate(60,0)">
  <!-- observed days 14..23 -->
  <g>
    <rect x="160" y="44" width="20" height="18" class="fl"/><rect x="180" y="44" width="20" height="18" class="fl"/>
    <rect x="200" y="44" width="20" height="18" class="fl"/><rect x="220" y="44" width="20" height="18" class="fl"/>
    <rect x="240" y="44" width="20" height="18" class="fl"/><rect x="260" y="44" width="20" height="18" class="fl"/>
    <rect x="280" y="44" width="20" height="18" class="fl"/><rect x="300" y="44" width="20" height="18" class="fl"/>
    <rect x="320" y="44" width="20" height="18" class="fl"/><rect x="340" y="44" width="20" height="18" class="fl"/>
  </g>
  <!-- targets days 24.. -->
  <rect x="360" y="44" width="20" height="18" class="tg"/><rect x="380" y="44" width="20" height="18" class="tg"/>
  <rect x="400" y="44" width="20" height="18" class="tg"/><rect x="420" y="44" width="20" height="18" class="tg"/>
  <rect x="440" y="44" width="20" height="18" class="tg" opacity=".6"/><rect x="460" y="44" width="20" height="18" class="tg" opacity=".4"/>
  <text x="370" y="36" text-anchor="middle" class="sm">0</text>
  <text x="390" y="36" text-anchor="middle" class="sm">1</text>
  <text x="410" y="36" text-anchor="middle" class="sm">2</text>
  <text x="430" y="36" text-anchor="middle" class="sm">3</text>
  <text x="456" y="36" class="mut sm">…  horizons count days</text>

  <rect x="160" y="114" width="140" height="22" class="fl"/>
  <text x="230" y="129" text-anchor="middle" class="sm">days 14–20</text>
  <!-- week under way: [21,24) elapsed hatched, [24,28) predicted -->
  <rect x="300" y="114" width="60" height="22" class="el"/>
  <rect x="360" y="114" width="80" height="22" class="tg"/>
  <rect x="440" y="114" width="140" height="22" class="tg"/>
  <rect x="580" y="114" width="140" height="22" class="tg"/>
  <text x="370" y="106" class="sm b">horizon 0</text>
  <text x="510" y="106" text-anchor="middle" class="sm">horizon 1</text>
  <text x="650" y="106" text-anchor="middle" class="sm">horizon 2</text>
  <text x="510" y="129" text-anchor="middle" class="sm">days 28–34</text>
  <text x="650" y="129" text-anchor="middle" class="sm">days 35–41</text>
  <text x="372" y="158" class="mut sm">hatched: days 21–23 have happened, inferred from the state</text>
  <text x="372" y="172" class="mut sm">days 24–27 are predicted; horizon 0 is the whole week</text>

  <!-- origin -->
  <line x1="360" y1="22" x2="360" y2="192" class="cut"/>
  <text x="360" y="208" text-anchor="middle" class="b">forecast origin: day 24 begins</text>

  <!-- axis -->
  <line x1="160" y1="222" x2="720" y2="222" class="ax"/>
  <g class="ax"><line x1="160" y1="222" x2="160" y2="227"/><line x1="300" y1="222" x2="300" y2="227"/><line x1="440" y1="222" x2="440" y2="227"/><line x1="580" y1="222" x2="580" y2="227"/><line x1="720" y1="222" x2="720" y2="227"/></g>
  <text x="160" y="241" text-anchor="middle" class="mut sm">day 14</text>
  <text x="300" y="241" text-anchor="middle" class="mut sm">21</text>
  <text x="440" y="241" text-anchor="middle" class="mut sm">28</text>
  <text x="580" y="241" text-anchor="middle" class="mut sm">35</text>
  <text x="720" y="241" text-anchor="middle" class="mut sm">42</text>
  </g>
</svg>
