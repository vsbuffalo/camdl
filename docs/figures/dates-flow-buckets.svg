<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 196" role="img" aria-labelledby="t d">
  <title id="t">Flow buckets</title>
  <desc id="d">The engine accumulates flow over intervals open at the left and closed at the right: the bucket at 1 covers (0, 1], the bucket at 2 covers (1, 2], and the bucket at 3 covers (2, 3]. Each spans the same 24 hours as the civil day before its boundary.</desc>

  <!-- internal t = k sits at x = 175 + 100k -->
  <text x="140" y="34" class="t-label fig-muted" text-anchor="end">internal t</text>
  <text x="175" y="34" class="t-mono-label fig-ink" text-anchor="middle">0</text>
  <text x="275" y="34" class="t-mono-label fig-ink" text-anchor="middle">1</text>
  <text x="375" y="34" class="t-mono-label fig-ink" text-anchor="middle">2</text>
  <text x="475" y="34" class="t-mono-label fig-ink" text-anchor="middle">3</text>
  <text x="575" y="34" class="t-mono-label fig-ink" text-anchor="middle">4</text>
  <line x1="162" y1="56" x2="588" y2="56" class="s-muted"/>
  <line x1="175" y1="49" x2="175" y2="63" class="s-muted"/>
  <line x1="275" y1="49" x2="275" y2="63" class="s-muted"/>
  <line x1="375" y1="49" x2="375" y2="63" class="s-muted"/>
  <line x1="475" y1="49" x2="475" y2="63" class="s-muted"/>
  <line x1="575" y1="49" x2="575" y2="63" class="s-muted"/>
  <text x="140" y="99" class="t-label fig-muted" text-anchor="end">bucket at 1</text>
  <rect x="175" y="80" width="99" height="28" class="fig-accent-soft"/>
  <line x1="274" y1="80" x2="274" y2="108" class="s-accent"/>
  <text x="225" y="99" class="t-mono-label fig-ink" text-anchor="middle">(0, 1]</text>
  <text x="140" y="139" class="t-label fig-muted" text-anchor="end">bucket at 2</text>
  <rect x="275" y="120" width="99" height="28" class="fig-accent-soft"/>
  <line x1="374" y1="120" x2="374" y2="148" class="s-accent"/>
  <text x="325" y="139" class="t-mono-label fig-ink" text-anchor="middle">(1, 2]</text>
  <text x="140" y="179" class="t-label fig-muted" text-anchor="end">bucket at 3</text>
  <rect x="375" y="160" width="99" height="28" class="fig-accent-soft"/>
  <line x1="474" y1="160" x2="474" y2="188" class="s-accent"/>
  <text x="425" y="179" class="t-mono-label fig-ink" text-anchor="middle">(2, 3]</text>
</svg>
