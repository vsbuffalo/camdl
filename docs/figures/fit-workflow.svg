<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 304" role="img" aria-labelledby="t d">
  <title id="t">The fit workflow</title>
  <desc id="d">Ten steps in order. Before any fit: write the model, check it, simulate from it, recover known parameters from synthetic data, and choose an inference method. The fit: write fit.toml, fit run, fit summary, fit predict, and validate. Two further steps are optional and used only when a fit needs them: survey, which maps the likelihood surface, and if2, which gives a point estimate and profiles.</desc>
  <defs>
    <marker id="wf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="fig-arrow"/>
    </marker>
  </defs>

  <!-- row 1: before any fit -->
  <text x="2" y="22" class="t-cap fig-muted">BEFORE ANY FIT</text>
  <g class="t-small t-b fig-ink" text-anchor="middle">
    <rect x="2" y="34" width="108" height="56" rx="4" class="fig-card s-line"/>
    <text x="56" y="67">write model</text>
    <rect x="134" y="34" width="108" height="56" rx="4" class="fig-card s-line"/>
    <text x="188" y="67">check</text>
    <rect x="266" y="34" width="108" height="56" rx="4" class="fig-card s-line"/>
    <text x="320" y="67">simulate</text>
    <rect x="398" y="34" width="108" height="56" rx="4" class="fig-card s-line"/>
    <text x="452" y="59">synthetic</text>
    <text x="452" y="77">recovery</text>
    <rect x="530" y="34" width="108" height="56" rx="4" class="fig-accent-soft s-accent"/>
    <text x="584" y="59">choose a</text>
    <text x="584" y="77">method</text>
  </g>

  <!-- row 2: the fit -->
  <text x="70" y="152" class="t-cap fig-muted">THE FIT</text>
  <g class="t-small t-b fig-ink" text-anchor="middle">
    <rect x="2" y="164" width="108" height="56" rx="4" class="fig-card s-line"/>
    <text x="56" y="189">write</text>
    <text x="56" y="207">fit.toml</text>
    <rect x="134" y="164" width="108" height="56" rx="4" class="fig-ink-box"/>
    <rect x="266" y="164" width="108" height="56" rx="4" class="fig-card s-line"/>
    <text x="320" y="197">fit summary</text>
    <rect x="398" y="164" width="108" height="56" rx="4" class="fig-card s-line"/>
    <text x="452" y="197">fit predict</text>
    <rect x="530" y="164" width="108" height="56" rx="4" class="fig-card s-line"/>
    <text x="584" y="197">validate</text>
  </g>

  <text x="188" y="197" class="t-small t-b fig-inverse" text-anchor="middle">fit run</text>

  <!-- arrows within rows -->
  <g class="s-arrow">
    <line x1="111" y1="62" x2="132" y2="62" marker-end="url(#wf-arrow)"/>
    <line x1="243" y1="62" x2="264" y2="62" marker-end="url(#wf-arrow)"/>
    <line x1="375" y1="62" x2="396" y2="62" marker-end="url(#wf-arrow)"/>
    <line x1="507" y1="62" x2="528" y2="62" marker-end="url(#wf-arrow)"/>
    <line x1="111" y1="192" x2="132" y2="192" marker-end="url(#wf-arrow)"/>
    <line x1="243" y1="192" x2="264" y2="192" marker-end="url(#wf-arrow)"/>
    <line x1="375" y1="192" x2="396" y2="192" marker-end="url(#wf-arrow)"/>
    <line x1="507" y1="192" x2="528" y2="192" marker-end="url(#wf-arrow)"/>
  </g>
  <!-- row 1 to row 2 -->
  <path d="M584,91 V122 H56 V162" class="s-arrow" fill="none" marker-end="url(#wf-arrow)"/>

  <!-- optional steps -->
  <rect x="2" y="242" width="636" height="60" rx="5" class="fig-panel"/>
  <text x="16" y="262" class="t-cap fig-muted">OPTIONAL, WHEN A FIT NEEDS THEM</text>
  <g class="t-small fig-ink">
    <rect x="16" y="270" width="296" height="24" rx="3" class="fig-card s-muted" stroke-dasharray="4 3"/>
    <text x="28" y="287"><tspan class="t-b">survey</tspan>  map the likelihood surface</text>
    <rect x="328" y="270" width="296" height="24" rx="3" class="fig-card s-muted" stroke-dasharray="4 3"/>
    <text x="340" y="287"><tspan class="t-b">if2</tspan>  a point estimate, profiles</text>
  </g>
</svg>
