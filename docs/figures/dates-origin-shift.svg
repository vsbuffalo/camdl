  <text x="250" y="214" class="t-code-cell fig-muted" text-anchor="middle">1</text>
  <text x="310" y="214" class="t-code-cell fig-muted" text-anchor="middle">2</text>
  <text x="370" y="214" class="t-code-cell fig-muted" text-anchor="middle">3</text>
  <text x="430" y="214" class="t-code-cell fig-muted" text-anchor="middle">4</text>
  <text x="490" y="214" class="t-code-cell fig-muted" text-anchor="middle">5</text>
  <text x="550" y="214" class="t-code-cell fig-muted" text-anchor="middle">6</text>
  <text x="610" y="214" class="t-code-cell fig-muted" text-anchor="middle">7</text>
  <rect x="551" y="222" width="58" height="24" class="fig-accent-soft"/>
  <text x="580" y="238" class="t-code-cell t-b fig-accent" text-anchor="middle">(6, 7]</text>
  <text x="150" y="58" class="t-small fig-muted" text-anchor="end">internal t:</text>
  <text x="580" y="282" class="t-small t-b fig-accent" text-anchor="middle">1 Jul</text>
  <text x="540" y="282" class="t-small fig-muted" text-anchor="end">row "07-02" under closing_at, every origin:</text>
</svg>
