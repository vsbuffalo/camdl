<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 262" role="img" aria-labelledby="t d">
  <title id="t">Target positions on a daily and a weekly stream, with a week under way at the forecast origin</title>
  <desc id="d">A daily stream observed through 28 January and a weekly stream whose last training row covers 19 to 25 January. The forecast origin is the start of 29 January, day 24. The daily stream's targets are 29 January, 30 January, 31 January and 1 February, at positions 0 to 3. The weekly stream's week of 26 January to 1 February began before the origin: 26 to 28 January have happened and their count is estimated through the conditioning on the daily rows, 29 January to 1 February are simulated, and the whole week is the weekly stream's target at position 0. The week of 2 to 8 February is at position 1 and the week of 9 to 15 February at position 2.</desc>

  <!-- day d sits at x = 150 + 16 * (d - 14); day 0 is 5 January 2025 -->
  <text x="4" y="58" class="t-mono-label fig-ink">daily</text>
  <text x="4" y="126" class="t-mono-label fig-ink">weekly</text>

  <!-- daily: observed days 14 to 23, targets from day 24 -->
  <g class="fig-panel s-line">
    <rect x="150" y="44" width="16" height="20"/><rect x="166" y="44" width="16" height="20"/>
    <rect x="182" y="44" width="16" height="20"/><rect x="198" y="44" width="16" height="20"/>
    <rect x="214" y="44" width="16" height="20"/><rect x="230" y="44" width="16" height="20"/>
    <rect x="246" y="44" width="16" height="20"/><rect x="262" y="44" width="16" height="20"/>
    <rect x="278" y="44" width="16" height="20"/><rect x="294" y="44" width="16" height="20"/>
  </g>
  <g class="fig-accent-soft s-accent">
    <rect x="310" y="44" width="16" height="20"/><rect x="326" y="44" width="16" height="20"/>
    <rect x="342" y="44" width="16" height="20"/><rect x="358" y="44" width="16" height="20"/>
  </g>
  <g class="t-small fig-ink" text-anchor="middle">
    <text x="318" y="36">0</text><text x="334" y="36">1</text><text x="350" y="36">2</text><text x="366" y="36">3</text>
  </g>
  <text x="384" y="36" class="t-small fig-muted">positions count days</text>

  <!-- weekly: days 14 to 20 observed; the week of days 21 to 27 under way -->
  <rect x="150" y="110" width="112" height="24" class="fig-panel s-line"/>
  <text x="206" y="127" text-anchor="middle" class="t-small fig-muted">19–25 Jan</text>
  <rect x="262" y="110" width="48" height="24" class="fig-code-bg s-warm" stroke-width="1.6" stroke-dasharray="4 3"/>
  <rect x="310" y="110" width="64" height="24" class="fig-accent-soft s-accent"/>
  <rect x="374" y="110" width="112" height="24" class="fig-accent-soft s-accent"/>
  <rect x="486" y="110" width="112" height="24" class="fig-accent-soft s-accent"/>
  <g class="t-small fig-ink" text-anchor="middle">
    <text x="346" y="102">position 0</text><text x="430" y="102">position 1</text><text x="542" y="102">position 2</text>
    <text x="430" y="127">2–8 Feb</text><text x="542" y="127">9–15 Feb</text>
  </g>
  <text x="330" y="156" class="t-small fig-ink">29 Jan – 1 Feb: simulated after the origin</text>
  <text x="330" y="176" class="t-small fig-warm">26–28 Jan: happened, estimated through the daily rows</text>

  <!-- the forecast origin -->
  <line x1="310" y1="20" x2="310" y2="196" class="s-muted" stroke-dasharray="5 4"/>
  <text x="310" y="214" text-anchor="middle" class="t-label t-b fig-ink">forecast origin, 29 Jan (day 24)</text>

  <line x1="150" y1="232" x2="598" y2="232" class="s-muted"/>
  <g class="s-muted">
    <line x1="150" y1="232" x2="150" y2="238"/><line x1="262" y1="232" x2="262" y2="238"/>
    <line x1="374" y1="232" x2="374" y2="238"/><line x1="486" y1="232" x2="486" y2="238"/>
    <line x1="598" y1="232" x2="598" y2="238"/>
  </g>
  <g class="t-small fig-muted" text-anchor="middle">
    <text x="150" y="256">19 Jan</text><text x="262" y="256">26 Jan</text><text x="374" y="256">2 Feb</text>
    <text x="486" y="256">9 Feb</text><text x="598" y="256">16 Feb</text>
  </g>
</svg>
