<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 278" role="img" aria-labelledby="t d">
  <title id="t">One forecast of a weekly stream: training rows, forecast origin, targets, periods ahead and lead times</title>
  <desc id="d">A weekly stream with ten weeks, each labelled by the Saturday that ends it, from the week ending 11 January to the week ending 15 March 2025. The first six rows, through the week ending 15 February, are the training rows: the parameters were fitted to them and the particle filter conditioned the latent state on them, so they are also the conditioning rows. The forecast origin is the start of 16 February, day 42. The next four weeks are the forecast targets, at 1, 2, 3 and 4 periods ahead, with lead times of 7, 14, 21 and 28 days, each measured from the origin to the end of the target. A reach of four weeks keeps the targets that end within 28 days of the origin.</desc>
  <defs>
    <marker id="fot-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="fig-arrow"/>
    </marker>
  </defs>

  <!-- day d sits at x = 20 + 52 * d / 7 -->
  <text x="20" y="16" class="t-small fig-ink">training rows: the rows the parameters were fitted to</text>
  <path d="M20,30 L20,24 L332,24 L332,30" class="s-muted"/>
  <text x="20" y="50" class="t-small fig-ink">conditioning rows: the rows the latent state was conditioned on</text>
  <path d="M20,64 L20,58 L332,58 L332,64" class="s-muted"/>

  <g class="fig-panel s-line">
    <rect x="20" y="72" width="52" height="28"/><rect x="72" y="72" width="52" height="28"/>
    <rect x="124" y="72" width="52" height="28"/><rect x="176" y="72" width="52" height="28"/>
    <rect x="228" y="72" width="52" height="28"/><rect x="280" y="72" width="52" height="28"/>
  </g>
  <g class="fig-accent-soft s-accent">
    <rect x="332" y="72" width="52" height="28"/><rect x="384" y="72" width="52" height="28"/>
    <rect x="436" y="72" width="52" height="28"/><rect x="488" y="72" width="52" height="28"/>
  </g>
  <text x="176" y="91" text-anchor="middle" class="t-small fig-muted">six training rows</text>
  <g class="t-small fig-ink" text-anchor="middle">
    <text x="358" y="91">1 ahead</text><text x="410" y="91">2 ahead</text>
    <text x="462" y="91">3 ahead</text><text x="514" y="91">4 ahead</text>
  </g>

  <g class="t-small fig-muted" text-anchor="middle">
    <text x="20" y="118">5 Jan</text><text x="72" y="118">12 Jan</text><text x="124" y="118">19 Jan</text>
    <text x="176" y="118">26 Jan</text><text x="228" y="118">2 Feb</text><text x="280" y="118">9 Feb</text>
    <text x="384" y="118">23 Feb</text><text x="436" y="118">2 Mar</text>
    <text x="488" y="118">9 Mar</text><text x="540" y="118">16 Mar</text>
  </g>
  <text x="20" y="132" class="t-small fig-muted">week boundaries (the start of each date)</text>

  <!-- the forecast origin -->
  <line x1="332" y1="64" x2="332" y2="232" class="s-muted" stroke-dasharray="5 4"/>
  <text x="332" y="250" text-anchor="middle" class="t-label t-b fig-ink">forecast origin, 16 Feb (day 42)</text>
  <text x="332" y="270" text-anchor="middle" class="t-small fig-muted">the training extent: the end of the last training row</text>

  <!-- lead times -->
  <g class="s-arrow">
    <line x1="332" y1="136" x2="383" y2="136" marker-end="url(#fot-arrow)"/>
    <line x1="332" y1="154" x2="435" y2="154" marker-end="url(#fot-arrow)"/>
    <line x1="332" y1="172" x2="487" y2="172" marker-end="url(#fot-arrow)"/>
    <line x1="332" y1="190" x2="539" y2="190" marker-end="url(#fot-arrow)"/>
  </g>
  <g class="t-small fig-ink">
    <text x="390" y="141">lead 7</text><text x="442" y="159">lead 14</text>
    <text x="494" y="177">lead 21</text><text x="546" y="195">lead 28</text>
  </g>

  <!-- the reach -->
  <path d="M332,208 L332,214 L540,214 L540,208" class="s-muted"/>
  <text x="344" y="232" class="t-small fig-ink"><tspan class="t-mono">--horizon "4 weeks"</tspan>: targets ending by 16 Mar</text>
</svg>
