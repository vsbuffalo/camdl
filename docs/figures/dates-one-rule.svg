<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 116" role="img" aria-labelledby="t d">
  <title id="t">Where calendar structure is erased</title>
  <desc id="d">An ISO date, from data or a date() literal, is converted by parse_time_cell to internal time, an f64 that is all the engine ever sees; a date renderer converts internal time back to an ISO date for output.</desc>
  <defs>
    <marker id="dates-one-rule-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="fig-arrow"/>
    </marker>
  </defs>

  <rect x="2" y="30" width="120" height="78" rx="4" class="fig-card s-line"/>
  <text x="14" y="56" class="t-label t-b fig-ink">ISO date</text>
  <text x="14" y="76" class="t-small fig-muted">data in, and</text>
  <text x="14" y="98" class="t-small fig-muted"><tspan class="t-code-label">date()</tspan> literals</text>

  <line x1="124" y1="69" x2="258" y2="69" class="s-arrow" marker-end="url(#dates-one-rule-arrow)"/>
  <text x="191" y="60" class="t-code-cell fig-muted" text-anchor="middle">parse_time_cell</text>

  <rect x="262" y="30" width="140" height="78" rx="4" class="fig-ink-box"/>
  <text x="274" y="56" class="t-label t-b fig-inverse">internal time</text>
  <text x="274" y="76" class="t-small fig-inverse-muted"><tspan class="t-code-label">f64</tspan>: the whole</text>
  <text x="274" y="98" class="t-small fig-inverse-muted">engine</text>

  <line x1="404" y1="69" x2="514" y2="69" class="s-arrow" marker-end="url(#dates-one-rule-arrow)"/>
  <text x="459" y="60" class="t-code-cell fig-muted" text-anchor="middle">date renderer</text>

  <rect x="518" y="30" width="120" height="78" rx="4" class="fig-card s-line"/>
  <text x="530" y="56" class="t-label t-b fig-ink">ISO date</text>
  <text x="530" y="76" class="t-small fig-muted">output</text>
</svg>
