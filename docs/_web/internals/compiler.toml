# The compiler's internals pages (make docs-internals). This file sets only
# the order and grouping of the pages; every word on them comes from the doc
# comments in the source. A module of ocaml/lib/ missing from this list, or a
# name here with no module behind it, fails the build.

title = "The compiler"
summary = "How camdlc turns a .camdl file into the intermediate representation the runtime reads, described by its types."
repo_blob = "https://github.com/vsbuffalo/camdl/blob/main/"
order = 100

[[group]]
title = "Reading the source"
modules = ["Ast", "Param_annot", "Parser_errors", "Source_cache", "Diagnostics"]

[[group]]
title = "Checking the surface language"
modules = ["Time_typing"]

[[group]]
title = "Expanding the model"
modules = ["Compiler", "Expander"]

[[group]]
title = "The intermediate representation"
modules = ["Ir", "Serde", "Validate", "Declared", "Declared_emit"]

[[group]]
title = "Dimensional analysis"
modules = ["Dim_sites", "Dim_solve", "Dimcheck"]

[[group]]
title = "Passes over the IR"
modules = ["Constant_fold", "Licm", "Autodiff", "Expr_analysis", "Init_order", "Lineage", "Lint", "Passtime"]

[[group]]
title = "Presenting a model"
modules = ["Inspect", "Latex", "Pp_expr", "Term_style", "Doctest"]

[[group]]
title = "Utilities"
modules = ["Sha256"]
